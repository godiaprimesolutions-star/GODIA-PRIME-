name = "godiaprimeconnect"
main = "src/index.js"
compatibility_date = "2026-11-05"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_YOUR_EXISTING_D1_DATABASE_NAME"
database_id = "REPLACE_WITH_YOUR_EXISTING_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
MPESA_ENV = "production"
MPESA_TRANSACTION_TYPE = "CustomerPayBillOnline"
